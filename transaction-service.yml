spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payflow_transaction_db
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          account-service:
            connectTimeout: 2000
            readTimeout: 3000

payflow:
  service:
    message: "Transaction Service Config Server is working"
    internal-key: ${PAYFLOW_INTERNAL_KEY}
  jwt:
    secret: ${JWT_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      accountRead:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
