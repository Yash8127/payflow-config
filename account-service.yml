spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payflow_account_db
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

payflow:
  service:
    message: "Account Service Config Server is working"
    internal-key: ${PAYFLOW_INTERNAL_KEY}
    
  jwt:
    secret: ${JWT_SECRET}
